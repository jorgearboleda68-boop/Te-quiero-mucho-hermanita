<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mi hermanita</title>
<style>
  :root { --rosa: #f48fb1; --rosa-fuerte: #f06292; --dorado: #f7c948; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #fff5f9, #fdeef4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .instr { color: #b0356b; font-size: 18px; margin-bottom: 30px; min-height: 26px; text-align: center; }

  .regalo { position: relative; width: 200px; height: 200px; cursor: pointer; }
  .cuerpo { position: absolute; inset: 0; }
  .cuerpo.temblar { animation: temblar .09s infinite; }
  @keyframes temblar {
    0% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-3px,1px) rotate(-2deg); }
    75% { transform: translate(3px,-1px) rotate(2deg); }
    100% { transform: translate(0,0) rotate(0); }
  }

  .caja { position: absolute; bottom: 0; left: 25px; width: 150px; height: 110px;
          background: var(--rosa); border-radius: 8px; box-shadow: inset -12px 0 0 rgba(0,0,0,.08);
          transition: transform .5s, opacity .5s; }
  .tapa { position: absolute; top: 60px; left: 18px; width: 164px; height: 44px;
          background: var(--rosa-fuerte); border-radius: 8px; transition: transform .7s ease-in, opacity .7s; }
  .cinta-v { position: absolute; top: 60px; left: 90px; width: 20px; height: 140px; background: var(--dorado);
             transition: opacity .4s; }
  .cinta-h { position: absolute; top: 14px; left: 0; width: 100%; height: 16px; background: var(--dorado); }
  .mo { position: absolute; top: 4px; width: 40px; height: 34px; background: var(--dorado);
        border-radius: 50%; transition: opacity .4s, transform .4s; }
  .mo.i { left: 52px; transform: rotate(-25deg); }
  .mo.d { left: 108px; transform: rotate(25deg); }

  .regalo.abierto .tapa { transform: translate(-40px,-180px) rotate(-35deg); opacity: 0; }
  .regalo.abierto .caja { transform: scale(1.35); opacity: 0; }
  .regalo.abierto .cinta-v, .regalo.abierto .mo, .regalo.abierto .cinta-h { opacity: 0; }

  .mensaje { margin-top: 40px; font-size: 34px; font-weight: bold; color: #c2185b; text-align: center;
             padding: 0 20px; opacity: 0; transform: scale(.5);
             transition: all .6s cubic-bezier(.2,1.6,.5,1); min-height: 44px; }
  .mensaje.visible { opacity: 1; transform: scale(1); }

  .repetir { display: none; margin-top: 26px; background: var(--rosa-fuerte); color: #fff; border: none;
             padding: 12px 22px; border-radius: 24px; font-size: 16px; cursor: pointer; }

  .confeti { position: fixed; left: 50%; top: 45%; width: 10px; height: 10px; pointer-events: none;
             border-radius: 2px; font-size: 18px; line-height: 1; }

  .pie { position: fixed; bottom: 12px; left: 0; width: 100%; text-align: center;
         font-size: 12px; color: #c48aa6; font-style: italic; }
</style>
</head>
<body>

<div class="instr" id="instr">¡Mantén presionado el regalo!</div>

<div class="regalo" id="regalo">
  <div class="cuerpo" id="cuerpo">
    <div class="caja"></div>
    <div class="cinta-v"></div>
    <div class="tapa"><div class="cinta-h"></div></div>
    <div class="mo i"></div>
    <div class="mo d"></div>
  </div>
</div>

<div class="mensaje" id="mensaje">Te quiero mucho hermanita!!!</div>
<button class="repetir" id="repetir">Volver a verlo</button>

<div class="pie">estoy aprendiendo a programar xD</div>

<script>
const regalo = document.getElementById("regalo");
const cuerpo = document.getElementById("cuerpo");
const instr = document.getElementById("instr");
const mensaje = document.getElementById("mensaje");
const btnRepetir = document.getElementById("repetir");
const DURACION = 2500; // milisegundos que hay que mantener presionado
let inicio = null, raf = null, listo = false;

function paso(t) {
  const p = Math.min((t - inicio) / DURACION, 1);
  regalo.style.filter = `drop-shadow(0 0 ${10 + p * 35}px rgba(233,30,99,${0.3 + p * 0.6}))`;
  regalo.style.transform = `scale(${1 + p * 0.12})`;
  if (p >= 1) { abrir(); return; }
  raf = requestAnimationFrame(paso);
}

function empezar(e) {
  if (listo) return;
  e.preventDefault();
  inicio = performance.now();
  cuerpo.classList.add("temblar");
  instr.textContent = "Sigue presionando...";
  raf = requestAnimationFrame(paso);
}

function soltar() {
  if (listo || inicio === null) return;
  cancelAnimationFrame(raf);
  inicio = null;
  cuerpo.classList.remove("temblar");
  regalo.style.filter = "";
  regalo.style.transform = "";
  instr.textContent = "¡Mantén presionado el regalo!";
}

function abrir() {
  listo = true;
  inicio = null;
  cuerpo.classList.remove("temblar");
  regalo.classList.add("abierto");
  instr.textContent = "";
  confeti();
  setTimeout(() => mensaje.classList.add("visible"), 500);
  btnRepetir.style.display = "inline-block";
}

function confeti() {
  const colores = ["#f48fb1", "#f06292", "#f7c948", "#ffc1d9", "#e91e63"];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement("div");
    el.className = "confeti";
    if (i % 3 === 0) {
      el.textContent = "💖";
      el.style.background = "transparent";
    } else {
      el.style.background = colores[Math.floor(Math.random() * colores.length)];
    }
    document.body.appendChild(el);
    const dx = (Math.random() - 0.5) * 420;
    const dy = -(120 + Math.random() * 320);
    const r = (Math.random() - 0.5) * 720;
    el.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${r}deg)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${dx * 1.2}px, ${dy + 380}px) rotate(${r * 1.5}deg)`, opacity: 0 }
    ], { duration: 1800 + Math.random() * 800, easing: "ease-out" })
      .onfinish = () => el.remove();
  }
}

function reiniciar() {
  listo = false;
  regalo.classList.remove("abierto");
  regalo.style.filter = "";
  regalo.style.transform = "";
  mensaje.classList.remove("visible");
  btnRepetir.style.display = "none";
  instr.textContent = "¡Mantén presionado el regalo!";
}

regalo.addEventListener("pointerdown", empezar);
window.addEventListener("pointerup", soltar);
window.addEventListener("pointercancel", soltar);
regalo.addEventListener("contextmenu", e => e.preventDefault());
btnRepetir.addEventListener("click", reiniciar);
</script>
</body>
</html>
